<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF6E00'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='19' fill='%2305093D'%3EK%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="Kaizen Cross-Check: deterministic, traceable BOM, label, drawing and PCO cross-checking with the reviewer as the final decision-maker." />
    <meta name="theme-color" content="#030620" />
    <title>Kaizen Cross-Check</title>
    <script>
      // Theme boot: stamp the remembered or system theme before first paint so there is no flash.
      // Same rule as src/lib/theme.ts (readChoice + resolveTheme + applyTheme).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("kaizen.theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var d = document.documentElement;
        d.dataset.theme = t;
        d.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === "dark" ? "#02040E" : "#030620";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
